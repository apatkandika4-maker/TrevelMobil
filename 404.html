<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Halaman Tidak Ditemukan &mdash; Trevel Kalbar</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
    :root {
        --kb-ink: #0f172a;
        --kb-navy: #0b1220;
        --kb-navy-2: #111c33;
        --kb-orange: #ff6b00;
        --kb-orange-soft: #ff9435;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: 24px;
        color: #fff;
        background:
            radial-gradient(ellipse 60% 90% at 85% 0%, rgba(255,107,0,.12) 0, transparent 55%),
            linear-gradient(160deg, var(--kb-navy) 0%, var(--kb-navy-2) 60%, #16233f 100%);
    }
    .box { max-width: 480px; }
    .logo { width: 110px; height: auto; border-radius: 14px; margin-bottom: 20px; }
    .code {
        font-size: 5.5rem; font-weight: 800; line-height: 1;
        background: linear-gradient(135deg, var(--kb-orange-soft), var(--kb-orange));
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-size: 1.5rem; font-weight: 800; margin: 10px 0 8px; }
    p { color: rgba(255,255,255,.8); margin-bottom: 24px; line-height: 1.5; }
    .btn {
        display: inline-block; text-decoration: none; font-weight: 700;
        padding: .75rem 1.6rem; border-radius: 12px; color: #fff;
        background: linear-gradient(135deg, var(--kb-orange), var(--kb-orange-soft));
        box-shadow: 0 6px 18px rgba(255,107,0,.35);
    }
    .btn.wa { background: #25d366; box-shadow: 0 6px 18px rgba(37,211,102,.35); margin-left: 8px; }
    .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    @media (max-width: 420px) { .code { font-size: 4rem; } h1 { font-size: 1.25rem; } }
    </style>
</head>
<body>
    <div class="box">
        <img src="img/logo.jpeg" alt="Trevel Kalbar" class="logo">
        <div class="code">404</div>
        <h1>Halaman Tidak Ditemukan</h1>
        <p>Maaf, halaman yang kamu cari tidak ada. Mungkin alamatnya salah ketik. Yuk kembali ke beranda dan pilih rute perjalananmu.</p>
        <div class="btns">
            <a class="btn" href="/">Kembali ke Beranda</a>
            <a class="btn wa" href="https://wa.me/6281250325436" target="_blank" rel="noopener noreferrer">Chat Admin</a>
        </div>
    </div>
</body>
</html>
